# Comment a CRD compatibility report on every chart version bump in a pull request.
#
# crdsafe needs no special support for this: the report goes to stdout and the exit code is
# 0 safe / 1 needs review / 2 can destroy data. Everything below is glue you own and should edit.
#
# Two things this is deliberately built around, both learned from teams doing it for manifests:
#
#   A real GitOps PR bumps many services at once, so this loops over everything that changed and
#   posts ONE comment, not one per service.
#
#   The "nothing here is dangerous" answer is the point, not a side effect. A bulk bump where every
#   service reports clean is what lets it be merged quickly, so clean results are listed too.

name: crdsafe

on:
  pull_request:
    paths: ["clusters/**"] # narrow this to wherever your chart versions live

permissions:
  contents: read
  pull-requests: write

jobs:
  crd-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the base revision has to be readable

      - name: install crdsafe
        run: |
          VERSION=v0.1.6
          curl -sSL "https://github.com/leegun2000/crdsafe/releases/download/${VERSION}/crdsafe_${VERSION}_linux_amd64.tar.gz" \
            | tar -xz crdsafe
          sudo mv crdsafe /usr/local/bin/

      - name: check every chart that moved
        id: check
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          set -uo pipefail
          worst=0
          : > table.md
          : > details.md

          # ADAPT THIS QUERY. It reads a Flux HelmRelease; an Argo CD Application or a plain values
          # file is a different yq path, not different logic.
          for file in $(git diff --name-only "$BASE"... -- 'clusters/**/*.yaml'); do
            [ -f "$file" ] || continue
            chart=$(yq -r '.spec.chart.spec.chart // ""' "$file")
            repo=$(yq -r '.spec.chart.spec.sourceRef.url // ""' "$file")
            to=$(yq -r '.spec.chart.spec.version // ""' "$file")
            from=$(git show "$BASE:$file" 2>/dev/null | yq -r '.spec.chart.spec.version // ""')
            [ -z "$chart" ] || [ -z "$to" ] || [ -z "$from" ] && continue
            [ "$from" = "$to" ] && continue

            # --no-cluster because a CI runner usually has no kube access. Give the runner a
            # read-only kubeconfig and drop the flag to get the part that matters: which of your
            # live custom resources the new schema would invalidate.
            #
            # --redact keeps the cluster name, the exact server version and the values the
            # apiserver quotes back out of the comment. Drop it only on a private repository:
            # without it a report can contain a repository URL with a token in it, an internal
            # hostname, or a bucket name, taken straight from your own resources.
            crdsafe check --chart "$chart" --repo "$repo" --from "$from" --to "$to" \
              --no-cluster --redact > out.txt 2>&1
            rc=$?
            [ "$rc" -gt "$worst" ] && worst=$rc

            case $rc in
              0) mark="clean"; note="no CRD change blocks it" ;;
              1) mark="review"; note="a schema change can reject writes to existing resources" ;;
              2) mark="danger"; note="can destroy stored data" ;;
              *) mark="error";  note="crdsafe did not run" ;;
            esac
            # A chart that gates its CRDs behind a value renders none of them and exits 0. That is
            # not a clean bill of health, and a row saying "clean" would be the one lie this whole
            # job exists to avoid. Surface it as unchecked and carry the fix crdsafe suggests.
            if grep -q "nothing was compared" out.txt; then
              mark="not checked"
              note=$(grep -m1 "^warning:" out.txt | sed 's/^warning: //')
            fi
            printf '| `%s` | %s → %s | **%s** | %s |\n' "$chart" "$from" "$to" "$mark" "$note" >> table.md

            # A clean result needs one line, not a report nobody will open.
            if [ "$rc" -ne 0 ] || [ "$mark" = "not checked" ]; then
              printf '<details><summary><b>%s</b> %s → %s</summary>\n\n```\n' "$chart" "$from" "$to" >> details.md
              cat out.txt >> details.md
              printf '```\n\n</details>\n\n' >> details.md
            fi
          done

          echo "worst=$worst" >> "$GITHUB_OUTPUT"
          [ -s table.md ] && echo "any=1" >> "$GITHUB_OUTPUT" || echo "any=0" >> "$GITHUB_OUTPUT"

      - name: comment
        if: steps.check.outputs.any == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### crdsafe'
            echo
            echo '| chart | version | verdict | |'
            echo '|---|---|---|---|'
            cat table.md
            echo
            [ -s details.md ] && cat details.md
            echo '_Read-only. crdsafe never applies, patches, or deletes anything._'
          } > body.md
          # --edit-last keeps one comment per pull request instead of one per push.
          gh pr comment "${{ github.event.number }}" --body-file body.md --edit-last --create-if-none

      # Block only on "can destroy stored data". Use `!= '0'` to block on "review" as well, but
      # read the report for a few upgrades first: a gate that fires on ordinary version bumps
      # teaches people to ignore it, which costs more than it saves.
      - name: gate
        if: steps.check.outputs.worst == '2'
        run: |
          echo "crdsafe reported a change that can destroy stored data" >&2
          exit 1
