name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: build
        run: |
          set -eu
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o crdsafe .
            tar -czf "crdsafe_${GITHUB_REF_NAME}_${os}_${arch}.tar.gz" crdsafe LICENSE
            rm crdsafe
          done
          sha256sum crdsafe_*.tar.gz > "crdsafe_${GITHUB_REF_NAME}_checksums.txt"
      - run: gh release create "$GITHUB_REF_NAME" crdsafe_*.tar.gz crdsafe_*_checksums.txt --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
